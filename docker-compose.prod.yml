services:
  backend:
    image: ${DOCKERHUB_USERNAME}/shophub-backend:${IMAGE_TAG:-latest}
    container_name: shophub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5003:5003"

  # Port 80 on this host belongs to the host-level nginx reverse proxy
  # (installed directly on Ubuntu, not in Docker -- see
  # reference_ec2_nginx_proxy_architecture), which forwards
  # / -> 127.0.0.1:3001, /api/ -> 127.0.0.1:5003, /admin/ -> 127.0.0.1:3002.
  # None of these containers may bind 0.0.0.0 or host port 80: that would
  # either conflict with the host nginx (frontend fails to start) or expose
  # the containers directly to the internet, bypassing it.
  frontend:
    image: ${DOCKERHUB_USERNAME}/shophub-frontend:${IMAGE_TAG:-latest}
    container_name: shophub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:80"

  admin:
    image: ${DOCKERHUB_USERNAME}/shophub-admin:${IMAGE_TAG:-latest}
    container_name: shophub-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3002:80"
